<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSV Getter Helper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <p class="eyebrow">CSV Getter Helper</p>
      <h1>Run CSV Helper</h1>
      <p class="copy">
        Open the CSV getter page first, choose the location, then run the helper to fill filters
        and click Preview.
      </p>
      <label class="field">
        <span>Location</span>
        <div class="location-row">
          <select id="location-select" class="select-input">
            <option value="">Select a location</option>
          </select>
          <button id="favorite-toggle" class="secondary-button favorite-toggle" type="button">
            Add Favorite
          </button>
        </div>
      </label>
      <section id="favorite-section" class="favorite-section hidden" aria-label="Favorite locations">
        <p class="section-label">Favorites</p>
        <div id="favorite-actions" class="favorite-actions"></div>
      </section>
      <label class="field">
        <span>First Day Of Session</span>
        <button id="session-date-button" class="date-button" type="button" aria-haspopup="dialog">
          Select date
        </button>
        <input id="session-date" type="hidden" />
      </label>
      <fieldset class="mode-field">
        <legend>CSV Range</legend>
        <label class="mode-option">
          <input type="radio" name="export-mode" value="single_day" checked />
          <span>Single day</span>
        </label>
        <label class="mode-option">
          <input type="radio" name="export-mode" value="planner_week" />
          <span>Planner week</span>
        </label>
        <label class="mode-option">
          <input type="radio" name="export-mode" value="planner_two_weeks" />
          <span>Planner 2 weeks</span>
        </label>
      </fieldset>
      <section id="date-picker" class="date-picker hidden" aria-label="Calendar date picker">
        <div class="date-picker-header">
          <button id="calendar-prev" class="calendar-nav" type="button" aria-label="Previous month">
            Prev
          </button>
          <p id="calendar-label" class="calendar-label"></p>
          <button id="calendar-next" class="calendar-nav" type="button" aria-label="Next month">
            Next
          </button>
        </div>
        <div class="calendar-weekdays" aria-hidden="true">
          <span>Su</span>
          <span>Mo</span>
          <span>Tu</span>
          <span>We</span>
          <span>Th</span>
          <span>Fr</span>
          <span>Sa</span>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>
      </section>
      <div class="actions">
        <button id="run-preset" type="button">Run Helper</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
