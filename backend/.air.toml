root = "."
tmp_dir = "tmp"
env_files = ["../.env.local"]

[build]
  cmd = "go build -o ./tmp/main ./cmd/server"
  entrypoint = ["./tmp/main"]
  include_dir = ["cmd", "internal", "tasks"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "cmd/server/tmp", "vendor", "testdata"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  log = "build-errors.log"
  send_interrupt = true
  kill_delay = "500ms"
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
