# fly.toml app configuration file generated for decksupervisor on 2026-01-20T14:57:49-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'decksupervisor'
primary_region = 'yyz'

[build]
  dockerfile = 'backend/Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[http_service.concurrency]
  type = 'requests'
  soft_limit = 8
  hard_limit = 12

[env]
  ATTENDANCE_PDF_CONCURRENCY = '2'

[[vm]]
  memory = '2gb'
  cpus = 2
  memory_mb = 2048
