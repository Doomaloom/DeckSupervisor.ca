# fly.toml app configuration file generated for decksupervisor on 2026-01-20T14:57:49-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'decksupervisor'
primary_region = 'yyz'

[build]
  dockerfile = 'backend/Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[http_service.concurrency]
  type = 'requests'
  soft_limit = 8
  hard_limit = 12

[[http_service.checks]]
  interval = '30s'
  timeout = '5s'
  grace_period = '10s'
  method = 'GET'
  path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
